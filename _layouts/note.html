---
layout: default
---
<article>
  <header class="page-head">
    <p class="meta"><a href="{{ '/notes/' | relative_url }}">Notes</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %b %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    {%- if page.tags.size > 0 %}
    <ul class="tags" aria-label="Tags">{% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}</ul>
    {%- endif %}
  </header>

  {{ content }}

  <p class="back"><a href="{{ '/notes/' | relative_url }}">← All notes</a></p>
</article>
